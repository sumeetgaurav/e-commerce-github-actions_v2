name: Show Env Variables

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment you want'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - stg
          - prd

env:
  NAME: Sumeet

jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: Show Plain Text Env
        run: echo "My name is ${{ env.NAME }}"
      - name: Show Secrets
        run: echo "The Secret is ${{ secrets.TEXT_SECRET }}"
      - name: Show Variables
        run: echo "My Docker Hub Username is ${{ vars.DOCKER_USERNAME }}"
